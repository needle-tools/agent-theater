<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<!--
		The idle icon, in the markup so a tab has one before any script runs.
		src/lib/favicon.ts swaps every [data-favicon] link for the red badge
		while a play is on.

		The .ico carries data-favicon too, and deliberately has NO sizes="any".
		That attribute says "this one is scalable, prefer it", and Chrome duly
		preferred it — which meant the tab kept the idle icon through an entire
		show however many PNGs said otherwise. Every candidate has to change
		state together, or the one that does not is the one that wins.
	-->
	<link rel="icon" type="image/x-icon" data-favicon href="%sveltekit.assets%/favicon/idle.ico" />
	<link rel="icon" type="image/png" sizes="16x16" data-favicon href="%sveltekit.assets%/favicon/idle-16.png" />
	<link rel="icon" type="image/png" sizes="32x32" data-favicon href="%sveltekit.assets%/favicon/idle-32.png" />
	<link rel="icon" type="image/png" sizes="48x48" data-favicon href="%sveltekit.assets%/favicon/idle-48.png" />
	<link rel="apple-touch-icon" data-favicon href="%sveltekit.assets%/favicon/idle-180.png" />
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
	<link rel="stylesheet" href="%sveltekit.assets%/brand.css" />
	<!-- The paper arrow, and the tool cursors. Generated by tools/cursors.mjs. -->
	<link rel="stylesheet" href="%sveltekit.assets%/cursors/cursors.css" />
	<!--
		Whether to count, decided before the counter can count anything.

		Inline and ahead of the script below, because the FIRST thing Rybbit
		does is record a page view — deciding this from the app's own module
		would be a decision taken after the thing it was meant to decide. The
		rules are the ones in src/lib/telemetry.ts, which keeps them for
		everything that happens later: nothing from localhost unless somebody
		asks with ?telemetry=on, and ?telemetry=off is remembered for good.

		`__RYBBIT_OPTOUT__` is Rybbit's own switch. Its other one is a
		`disable-rybbit` key in localStorage, deliberately left alone: that one
		is the reader's, and writing it here would overwrite a choice somebody
		made for themselves.
	-->
	<script>
		(function () {
			try {
				var asked = new URLSearchParams(location.search).get("telemetry");
				if (asked === "on" || asked === "off") localStorage.setItem("theater.telemetry", asked);
				var choice = asked === "on" || asked === "off"
					? asked
					: localStorage.getItem("theater.telemetry");
				var host = location.hostname;
				var local = host === "localhost" || host === "127.0.0.1" || host === "[::1]"
					|| /\.local$/.test(host) || /\.localhost$/.test(host);
				if (choice === "off" || (choice !== "on" && local)) window.__RYBBIT_OPTOUT__ = true;
			} catch (error) {
				// Blocked storage, an exotic URL: count, rather than lose a day
				// to analytics that silently switched itself off.
			}
		})();
	</script>
	<!--
		Rybbit, self-hosted on a needle.tools box: cookieless, no cross-site
		identity, and counting what src/lib/telemetry.ts hands it. Deferred, so
		it never delays the paper appearing — events fired before it lands are
		queued there and dealt when it does.
	-->
	<script src="https://analytics-2.needle.tools/api/script.js" data-site-id="9a72fbed06e7" defer></script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
	<div style="display: contents">%sveltekit.body%</div>
</body>

</html>
